name: Build and publish resume
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-${{ github.ref }}
  # Finish a production publication before starting the next one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Cache pinned tools and TeX resources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            ~/.cache/Tectonic
          key: resume-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup.mjs') }}
      - run: npm run setup
      - run: npm run check:source
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Prepare the checked static Vercel deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERCEL_ORG_ID: team_QmjRFzULoHfOTipsjFByfxON
          VERCEL_PROJECT_ID: prj_LcgDZVTASVqNx1TK1UJU2yh2HoLp
        run: node scripts/vercel.mjs prepare
      - name: Install pinned Vercel CLI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm install --global --ignore-scripts vercel@65.2.0
      - name: Publish the same checked artifact to Vercel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::Add the VERCEL_TOKEN repository Actions secret before publishing.'
            exit 1
          fi
          vercel deploy --prebuilt --prod --yes --scope somethea-sieks-projects --cwd .build/vercel
      - name: Verify Vercel PDF, Markdown and website against this build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/vercel.mjs verify https://resume-cv-silk.vercel.app/
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the checked website, PDF and Markdown
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the same checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
